name: Deploy Web IDE to GitHub Pages

# Builds the browser-native IDE (webide/) and publishes it to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches: [main, claude/webide]
    paths:
      - "webide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webide/package-lock.json
      - name: Install
        working-directory: webide
        run: npm ci
      - name: Build
        working-directory: webide
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webide/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

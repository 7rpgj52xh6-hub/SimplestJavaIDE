<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>CheerpJ Spike — Compiler-Probe</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
      body { font: 13px monospace; background: #111; color: #9f9; padding: 10px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h3 style="color:#ddd">javax.tools-Compiler-Probe im Browser</h3>
    <div id="log"></div>
    <script>
      const logEl = document.getElementById("log");
      const t0 = performance.now();
      const ms = () => (performance.now() - t0).toFixed(0) + " ms";
      const log = (s) => { const l = "[" + ms() + "] " + s; logEl.textContent += l + "\n"; console.log(l); };
      (async function () {
        try {
          log("cheerpjInit({version:17}) …");
          await cheerpjInit({ version: 17 });
          log("init done — running probe.jar");
          // No display needed: probe is console-only. Create a tiny one anyway
          // because some CheerpJ builds expect a display to exist.
          cheerpjCreateDisplay(200, 60);
          const code = await cheerpjRunJar("/app/probe.jar");
          log("probe exit code = " + code + " (probe output is in the browser CONSOLE)");
        } catch (e) {
          log("ERROR: " + (e && e.message ? e.message : e));
        }
      })();
    </script>
  </body>
</html>
